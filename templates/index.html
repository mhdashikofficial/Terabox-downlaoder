<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terabox Direct Link Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .btn-primary { background-color: #007bff; border: none; }
        .btn-primary:hover { background-color: #0056b3; }
        .result { word-break: break-all; background: #e9ecef; padding: 10px; border-radius: 5px; }
        .loading { display: none; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <h2><i class="fas fa-download"></i> Terabox Direct Link Generator</h2>
                        <p class="mb-0">Paste your Terabox share URL to get a one-click download link!</p>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="share_url" class="form-label"><i class="fas fa-link"></i> Terabox Share URL</label>
                                <input type="url" class="form-control" id="share_url" name="share_url" placeholder="https://www.terabox.com/s/1...?shareid=..." required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submit-btn">
                                <span class="loading-spinner loading"><i class="fas fa-spinner fa-spin"></i> Generating...</span>
                                <span class="default"><i class="fas fa-magic"></i> Generate Link</span>
                            </button>
                        </form>
                        {% if error %}
                            <div class="alert alert-warning mt-3" role="alert">
                                <i class="fas fa-exclamation-triangle"></i> {{ error }}
                            </div>
                        {% endif %}
                        {% if direct_link %}
                            <div class="mt-4">
                                <h5><i class="fas fa-check-circle text-success"></i> Success!</h5>
                                <div class="result">
                                    <strong>File Ready:</strong> <a href="{{ direct_link }}" target="_blank">{{ direct_link }}</a>
                                </div>
                                <button class="btn btn-outline-secondary mt-2" onclick="copyLink('{{ direct_link }}')">
                                    <i class="fas fa-copy"></i> Copy Link
                                </button>
                            </div>
                        {% endif %}
                    </div>
                    <div class="card-footer text-muted text-center">
                        <small>Powered by Flask & Terabox API | For public shares only</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('submit-btn').addEventListener('click', function() {
            this.querySelector('.loading').style.display = 'inline';
            this.querySelector('.default').style.display = 'none';
        });
        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => alert('Link copied!'));
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
